<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Crown / Top Lions Stylized Emblem -->
  <g fill="url(#goldGradient)">
    <!-- Central Lion Head silhouette -->
    <path d="M100,18 C115,18 122,28 122,42 C122,54 116,62 108,68 L108,82 L92,82 L92,68 C84,62 78,54 78,42 C78,28 85,18 100,18 Z" />
    <!-- Lion Mane Crest curls -->
    <circle cx="82" cy="35" r="7" />
    <circle cx="118" cy="35" r="7" />
    <circle cx="75" cy="48" r="8" />
    <circle cx="125" cy="48" r="8" />
    <circle cx="80" cy="62" r="7" />
    <circle cx="120" cy="62" r="7" />
    <!-- Left Guard Lion Profile -->
    <path d="M52,38 C52,28 64,22 72,25 C70,35 68,48 72,58 L62,70 L48,65 C45,55 48,45 52,38 Z" />
    <!-- Right Guard Lion Profile -->
    <path d="M148,38 C148,28 136,22 128,25 C130,35 132,48 128,58 L138,70 L152,65 C155,55 152,45 148,38 Z" />
  </g>

  <!-- Abacus Platform -->
  <rect x="35" y="86" width="130" height="12" rx="4" fill="#0F172A" stroke="url(#goldGradient)" stroke-width="1.5" />

  <!-- Center Ashoka Chakra on Abacus -->
  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#1E3A8A" />
    <!-- 24 Spokes -->
    <g stroke="#1E3A8A" stroke-width="1.6">
      <line x1="0" y1="-32" x2="0" y2="32" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(15)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(30)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(45)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(60)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(75)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(90)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(105)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(120)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(135)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(150)" />
      <line x1="0" y1="-32" x2="0" y2="32" transform="rotate(165)" />
    </g>
  </g>

  <!-- Left Bull / Galloping Horse Stylized Silhouette -->
  <path d="M42,125 C45,118 52,118 58,122 L62,132 L56,138 L48,135 Z" fill="url(#goldGradient)" />
  <path d="M158,125 C155,118 148,118 142,122 L138,132 L144,138 L152,135 Z" fill="url(#goldGradient)" />

  <!-- Lower Inverted Lotus Base -->
  <path d="M50,172 C70,186 130,186 150,172 L142,185 C120,195 80,195 58,185 Z" fill="url(#goldGradient)" opacity="0.9" />

  <!-- Satyameva Jayate (सत्यमेव जयते) Ribbon Banner -->
  <path d="M25,202 L175,202 L165,224 L35,224 Z" fill="#0F172A" stroke="url(#goldGradient)" stroke-width="1.5" />
  <text x="100" y="218" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="12" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
</svg>
