<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Subtle Indian Jali / Lattice Tile Pattern -->
  <g fill="none" stroke="#d97706" stroke-width="0.75" stroke-opacity="0.18">
    <!-- Center 8-pointed star/mandala -->
    <path d="M40,25 L45,35 L55,40 L45,45 L40,55 L35,45 L25,40 L35,35 Z" />
    <circle cx="40" cy="40" r="10" />
    <circle cx="40" cy="40" r="3" fill="#d97706" fill-opacity="0.12" />

    <!-- Corner stars meeting at tile edges for seamless repeat -->
    <path d="M0,0 L5,10 L15,15 L5,20 L0,30 L-5,20 L-15,15 L-5,10 Z" />
    <path d="M80,0 L85,10 L95,15 L85,20 L80,30 L75,20 L65,15 L75,10 Z" />
    <path d="M0,80 L5,90 L15,95 L5,100 L0,110 L-5,100 L-15,95 L-5,90 Z" />
    <path d="M80,80 L85,90 L95,95 L85,100 L80,110 L75,100 L65,95 L75,90 Z" />

    <!-- Diamond lattice connecting lines -->
    <path d="M40,0 L80,40 L40,80 L0,40 Z" stroke-dasharray="2,2" />
    <path d="M0,0 L80,80 M80,0 L0,80" stroke-opacity="0.08" />

    <!-- Floral petal arches -->
    <path d="M25,40 Q40,25 55,40 Q40,55 25,40 Z" />
    <path d="M40,25 Q55,40 40,55 Q25,40 40,25 Z" />

    <!-- Edge motifs -->
    <circle cx="0" cy="40" r="6" />
    <circle cx="80" cy="40" r="6" />
    <circle cx="40" cy="0" r="6" />
    <circle cx="40" cy="80" r="6" />
  </g>
</svg>
