<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6606" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="64" cy="64" r="62" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Saffron Top Arc -->
  <path d="M 64,6 A 58,58 0 0,1 120,48 L 94,54 A 32,32 0 0,0 64,32 Z" fill="url(#saffronGrad)" />
  <path d="M 64,6 A 58,58 0 0,0 8,48 L 34,54 A 32,32 0 0,1 64,32 Z" fill="url(#saffronGrad)" />
  
  <!-- Green Bottom Arc -->
  <path d="M 64,122 A 58,58 0 0,1 8,80 L 34,74 A 32,32 0 0,0 64,96 Z" fill="url(#greenGrad)" />
  <path d="M 64,122 A 58,58 0 0,0 120,80 L 94,74 A 32,32 0 0,1 64,96 Z" fill="url(#greenGrad)" />

  <!-- Center Circle - Ashoka Navy Blue -->
  <circle cx="64" cy="64" r="32" fill="#061c47" stroke="#FFE082" stroke-width="2" />

  <!-- Ashoka Chakra 24 Spokes (Radiating rays) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.85">
    <!-- 24 spokes rotated every 15 degrees -->
    <line x1="64" y1="36" x2="64" y2="92" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(15 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(30 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(45 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(60 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(75 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(90 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(105 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(120 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(135 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(150 64 64)" />
    <line x1="64" y1="36" x2="64" y2="92" transform="rotate(165 64 64)" />
  </g>

  <!-- Small inner chakra ring -->
  <circle cx="64" cy="64" r="19" fill="#04122d" stroke="#FFB300" stroke-width="1.5" />

  <!-- Devanagari Script 'जन' (Jan - People/Citizen) in White with Gold Glow -->
  <text x="64" y="73" font-family="'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">जन</text>
  
  <!-- Outer decorative beads -->
  <circle cx="64" cy="10" r="2.5" fill="#FF9933" />
  <circle cx="118" cy="64" r="2.5" fill="#FFB300" />
  <circle cx="64" cy="118" r="2.5" fill="#138808" />
  <circle cx="10" cy="64" r="2.5" fill="#FFB300" />
</svg>
