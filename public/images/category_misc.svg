<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nagar Nigam / Civic Amenities Indian Icon -->
  <defs>
    <linearGradient id="civicBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <!-- Indian Parliament / Municipal Bhavan Dome silhouette -->
  <path d="M32,15 C26,18 20,24 20,27 L44,27 C44,24 38,18 32,15 Z" fill="#D97706"/>
  <!-- Pinnacle / Kalash -->
  <line x1="32" y1="12" x2="32" y2="15" stroke="#D97706" stroke-width="2"/>
  <circle cx="32" cy="11" r="1.5" fill="#D97706"/>
  <!-- Bhavan Pillars Arch -->
  <rect x="18" y="27" width="28" height="4" fill="url(#civicBlue)"/>
  <!-- Pillars -->
  <rect x="20" y="31" width="3" height="13" fill="url(#civicBlue)"/>
  <rect x="26" y="31" width="3" height="13" fill="url(#civicBlue)"/>
  <rect x="32" y="31" width="3" height="13" fill="url(#civicBlue)"/>
  <rect x="38" y="31" width="3" height="13" fill="url(#civicBlue)"/>
  <rect x="44" y="31" width="3" height="13" fill="url(#civicBlue)"/>
  <!-- Base steps -->
  <rect x="16" y="44" width="32" height="4" rx="1" fill="url(#civicBlue)"/>
  <rect x="14" y="48" width="36" height="3" rx="1" fill="#1E3A8A"/>
  <!-- Water Drop / Jal Seva emblem accent -->
  <path d="M47,20 C47,24 43,28 43,30 C43,32.2 44.8,34 47,34 C49.2,34 51,32.2 51,30 C51,28 47,24 47,20 Z" fill="#0EA5E9" opacity="0.85"/>
</svg>